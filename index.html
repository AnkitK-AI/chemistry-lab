
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Lesson – Solar System</title>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #05060f;
  color: #f1f3ff;
  font-family: system-ui, sans-serif;
}

model-viewer {
  width: 100%;
  height: 68vh;
  min-height: 320px;
  background: radial-gradient(#1b2150, #05060f);
}

.ar-btn {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #ffb703;
  color: #111;
  border: 0;
  border-radius: 24px;
  padding: 12px 22px;
  font-size: 16px;
  font-weight: bold;
  white-space: nowrap;
}

.hs {
  background: #ffb703;
  color: #111;
  border: 0;
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 12px;
}

.bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px;
  scrollbar-width: thin;
}

.bar button,
.say,
.quiz-btn {
  background: #14183a;
  color: #f1f3ff;
  border: 1px solid #3a4180;
  border-radius: 20px;
  padding: 9px 14px;
  flex: none;
  font-size: 14px;
  cursor: pointer;
}

.bar button.on {
  background: #ffb703;
  color: #111;
  border-color: #ffb703;
}

.info {
  padding: 0 14px 24px;
}

.info h2 {
  margin: 4px 0;
  color: #ffcf54;
}

.info p {
  line-height: 1.6;
  margin-bottom: 14px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.say:hover,
.bar button:hover {
  border-color: #ffb703;
}

.quiz-btn {
  background: #ffb703;
  color: #111;
  border-color: #ffb703;
  font-weight: 750;
  padding: 10px 18px;
}

.quiz-btn:hover {
  background: #ffd166;
}

/* Quiz modal */

.quiz-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(2, 3, 12, .88);
  backdrop-filter: blur(7px);
}

.quiz-overlay.open {
  display: flex;
}

.quiz-card {
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  background: linear-gradient(160deg, #14183a, #090b1b 75%);
  border: 1px solid #3a4180;
  border-radius: 22px;
  padding: 23px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
}

.quiz-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.quiz-header h2 {
  margin: 0;
  color: #ffb703;
  font-size: 23px;
}

.quiz-subtitle {
  margin: 6px 0 20px;
  color: #b9c0e7;
  font-size: 13px;
}

.close-btn {
  width: 34px;
  height: 34px;
  flex: none;
  border: 1px solid #3a4180;
  background: #0c1028;
  color: #f1f3ff;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #b9c0e7;
  font-size: 12px;
  margin-bottom: 8px;
}

.progress-track {
  height: 6px;
  background: #252b54;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 22px;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: #ffb703;
  border-radius: 10px;
  transition: width .25s ease;
}

.question {
  font-size: 18px;
  line-height: 1.5;
  font-weight: 700;
  margin: 0 0 17px;
}

.options {
  display: grid;
  gap: 10px;
}

.option-btn {
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  border: 1px solid #3a4180;
  background: #10142f;
  color: #f1f3ff;
  border-radius: 13px;
  font-size: 14px;
  line-height: 1.5;
  cursor: pointer;
}

.option-btn:hover:not(:disabled) {
  border-color: #ffb703;
  background: #1a2047;
}

.option-btn:disabled {
  cursor: default;
  opacity: 1;
}

.option-btn.correct {
  background: #123b31;
  border-color: #41d6a0;
}

.option-btn.wrong {
  background: #401c2b;
  border-color: #ff7285;
}

.feedback {
  min-height: 25px;
  margin: 14px 0 4px;
  font-size: 13px;
  line-height: 1.6;
}

.feedback.good {
  color: #69e2b6;
}

.feedback.bad {
  color: #ff9aaa;
}

.quiz-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
}

.score-small {
  color: #b9c0e7;
  font-size: 13px;
}

.next-btn {
  background: #ffb703;
  color: #111;
  border: 0;
  border-radius: 20px;
  padding: 11px 18px;
  font-weight: 750;
  cursor: pointer;
}

.next-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.result {
  text-align: center;
  padding: 12px 0 5px;
}

.result-icon {
  font-size: 53px;
  margin-bottom: 12px;
}

.result h3 {
  font-size: 24px;
  margin: 0 0 10px;
  color: #ffb703;
}

.final-score {
  font-size: 38px;
  font-weight: 800;
  margin: 12px 0;
}

.result p {
  color: #c8ceeb;
  line-height: 1.6;
}

.result .next-btn {
  margin-top: 12px;
}

button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

@media (max-width: 480px) {
  model-viewer {
    height: 55vh;
    min-height: 280px;
  }

  .quiz-card {
    padding: 18px;
    border-radius: 18px;
  }

  .quiz-header h2 {
    font-size: 21px;
  }

  .question {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<model-viewer
  id="mv"
  src="models/solar_system.glb"
  alt="Interactive 3D Solar System"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  ar-scale="auto"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  touch-action="pan-y"
  interaction-prompt="auto">

  <button slot="ar-button" class="ar-btn">
    📱 View in your room (AR)
  </button>
</model-viewer>

<div class="bar" id="bar"></div>

<div class="info">
  <h2 id="nm">Solar System</h2>
  <p id="tx"></p>

  <div class="actions">
    <button class="say" id="say">▶ Narrate</button>
    <button class="quiz-btn" id="openQuiz">🧠 Take Quiz</button>
  </div>
</div>

<!-- Solar System Quiz -->
<div
  class="quiz-overlay"
  id="quizOverlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="quizTitle">

  <div class="quiz-card">

    <div class="quiz-header">
      <div>
        <h2 id="quizTitle">🚀 Solar System Quiz</h2>
        <p class="quiz-subtitle">Test your space knowledge!</p>
      </div>

      <button
        class="close-btn"
        id="closeQuiz"
        aria-label="Close quiz">×</button>
    </div>

    <div id="quizContent">
      <div class="progress-info">
        <span id="questionCount">Question 1 of 5</span>
        <span id="progressPercent">20%</span>
      </div>

      <div
        class="progress-track"
        id="progressTrack"
        role="progressbar"
        aria-label="Quiz progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="20">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <p class="question" id="questionText"></p>
      <div class="options" id="options"></div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <div class="quiz-footer">
        <span class="score-small" id="scoreSmall">Score: 0</span>
        <button class="next-btn" id="nextQuestion" disabled>
          Choose an answer
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const LESSON = [
  {
    n: "Solar System",
    src: "models/solar_system.glb",
    t: "Our solar system has one star, the Sun, and eight planets. Rocky planets are close to the Sun, and giant planets are far away. Sizes here are not to scale, so use pinch to zoom and look closely."
  },
  {
    n: "Sun",
    src: "models/sun.glb",
    t: "The Sun is a star at the centre of our solar system. It gives us light and heat. All the planets move around the Sun in paths called orbits."
  },
  {
    n: "Mercury",
    src: "models/mercury.glb",
    t: "Mercury is the planet closest to the Sun. It is the smallest planet and completes one orbit in just eighty eight days."
  },
  {
    n: "Venus",
    src: "models/venus.glb",
    t: "Venus is the brightest planet in our night sky. Thick clouds trap heat, which makes it the hottest planet."
  },
  {
    n: "Earth",
    src: "models/earth.glb",
    t: "Earth is the only planet known to have life. It has air, water and the right temperature. Earth takes about three hundred sixty five days to go around the Sun."
  },
  {
    n: "Mars",
    src: "models/mars.glb",
    t: "Mars is called the red planet because its soil contains iron oxide. It has two small moons named Phobos and Deimos."
  },
  {
    n: "Jupiter",
    src: "models/jupiter.glb",
    t: "Jupiter is the largest planet in the solar system. Its stripes are bands of clouds, and a giant storm has lasted for hundreds of years."
  },
  {
    n: "Saturn",
    src: "models/saturn.glb",
    t: "Saturn is famous for its beautiful rings made of ice and rock. It is less dense than water, although a planet cannot practically float in an ordinary ocean."
  },
  {
    n: "Uranus",
    src: "models/uranus.glb",
    t: "Uranus is an ice giant that spins on its side. It takes about eighty four years to orbit the Sun."
  },
  {
    n: "Neptune",
    src: "models/neptune.glb",
    t: "Neptune is the farthest planet from the Sun. It is cold, dark and has some of the fastest winds in the solar system."
  }
];

const QUESTIONS = [
  {
    q: "Which object is at the centre of our Solar System?",
    options: ["Earth", "The Moon", "The Sun", "Jupiter"],
    answer: 2,
    explanation: "The Sun is the star at the centre of our Solar System. All eight planets orbit it."
  },
  {
    q: "Which planet is closest to the Sun?",
    options: ["Venus", "Mercury", "Earth", "Mars"],
    answer: 1,
    explanation: "Mercury is the closest planet to the Sun and the smallest planet in our Solar System."
  },
  {
    q: "Which planet is known as the Red Planet?",
    options: ["Jupiter", "Venus", "Mars", "Neptune"],
    answer: 2,
    explanation: "Mars appears red because iron minerals in its surface soil have oxidised, similar to rust."
  },
  {
    q: "Which is the largest planet in our Solar System?",
    options: ["Saturn", "Earth", "Neptune", "Jupiter"],
    answer: 3,
    explanation: "Jupiter is the largest planet. It is a gas giant with enormous bands of clouds and a famous Great Red Spot."
  },
  {
    q: "Which planet is famous for its prominent rings?",
    options: ["Mercury", "Saturn", "Mars", "Venus"],
    answer: 1,
    explanation: "Saturn's spectacular rings are made mainly of ice particles, along with rocky debris and dust."
  }
];

const mv = document.getElementById("mv");
const bar = document.getElementById("bar");
const nm = document.getElementById("nm");
const tx = document.getElementById("tx");
const say = document.getElementById("say");

let cur = 0;


let availableVoices = [];

function loadVoices() {
  if (!("speechSynthesis" in window)) return;

  availableVoices = speechSynthesis.getVoices();
}

loadVoices();

if ("speechSynthesis" in window) {
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}

function chooseNaturalVoice() {
  // Prefer English voices and favour voices commonly
  // associated with enhanced or natural speech.
  const englishVoices = availableVoices.filter(voice =>
    /^en(-|_)/i.test(voice.lang)
  );

  const preferred = [
    /aria/i,
    /jenny/i,
    /samantha/i,
    /google.*english/i,
    /neural/i,
    /natural/i,
    /premium/i
  ];

  for (const pattern of preferred) {
    const match = englishVoices.find(voice =>
      pattern.test(voice.name)
    );

    if (match) return match;
  }

  // Otherwise prefer an English voice marked as local
  // or use the first English voice available.
  return englishVoices.find(voice => voice.localService)
      || englishVoices[0]
      || null;
}

function speak() {
  if (!("speechSynthesis" in window)) {
    alert("Text-to-speech is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(
    LESSON[cur].t
  );

  utterance.lang = "en-US";
  utterance.rate = 0.92;
  utterance.pitch = 1.02;
  utterance.volume = 1;

  const voice = chooseNaturalVoice();

  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  }

  speechSynthesis.speak(utterance);
}


function show(i) {
  if (!Number.isInteger(i) || i < 0 || i >= LESSON.length) {
    return;
  }

  cur = i;
  const planet = LESSON[i];

  mv.src = planet.src;
  mv.alt = `Interactive 3D model of ${planet.n}`;
  nm.textContent = planet.n;
  tx.textContent = planet.t;

  [...bar.children].forEach((button, index) => {
    button.classList.toggle("on", index === i);
  });

  speak();
}

LESSON.forEach((planet, i) => {
  const button = document.createElement("button");
  button.textContent = planet.n;
  button.type = "button";
  button.onclick = () => show(i);
  bar.appendChild(button);
});

say.onclick = speak;

// Support links such as ar.html?p=1
const requestedPage = Number(
  new URLSearchParams(location.search).get("p")
);

const initialPage =
  Number.isInteger(requestedPage) &&
  requestedPage >= 0 &&
  requestedPage < LESSON.length
    ? requestedPage
    : 0;

show(initialPage);

// Quiz elements
const overlay = document.getElementById("quizOverlay");
const openQuiz = document.getElementById("openQuiz");
const closeQuiz = document.getElementById("closeQuiz");
const quizContent = document.getElementById("quizContent");
const questionText = document.getElementById("questionText");
const optionsBox = document.getElementById("options");
const feedback = document.getElementById("feedback");
const nextQuestion = document.getElementById("nextQuestion");
const questionCount = document.getElementById("questionCount");
const progressPercent = document.getElementById("progressPercent");
const progressFill = document.getElementById("progressFill");
const progressTrack = document.getElementById("progressTrack");
const scoreSmall = document.getElementById("scoreSmall");

let questionIndex = 0;
let score = 0;
let answered = false;

function startQuiz() {
  questionIndex = 0;
  score = 0;
  answered = false;

  quizContent.style.display = "block";
  renderQuestion();

  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  closeQuiz.focus();
}

function renderQuestion() {
  const question = QUESTIONS[questionIndex];
  const progress = Math.round(
    ((questionIndex + 1) / QUESTIONS.length) * 100
  );

  questionCount.textContent =
    `Question ${questionIndex + 1} of ${QUESTIONS.length}`;

  progressPercent.textContent = `${progress}%`;
  progressFill.style.width = `${progress}%`;
  progressTrack.setAttribute("aria-valuenow", progress);

  questionText.textContent = question.q;
  optionsBox.replaceChildren();

  feedback.textContent = "";
  feedback.className = "feedback";

  scoreSmall.textContent = `Score: ${score}`;
  answered = false;
  nextQuestion.disabled = true;
  nextQuestion.textContent = "Choose an answer";

  question.options.forEach((option, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "option-btn";
    button.textContent =
      `${String.fromCharCode(65 + index)}. ${option}`;

    button.onclick = () => selectAnswer(index, button);
    optionsBox.appendChild(button);
  });
}

function selectAnswer(selectedIndex, selectedButton) {
  if (answered) return;

  answered = true;

  const question = QUESTIONS[questionIndex];
  const buttons = [...optionsBox.children];
  const correct = selectedIndex === question.answer;

  buttons.forEach((button, index) => {
    button.disabled = true;

    if (index === question.answer) {
      button.classList.add("correct");
    }
  });

  if (correct) {
    score++;

    feedback.textContent = `✓ Correct! ${question.explanation}`;
    feedback.className = "feedback good";
  } else {
    selectedButton.classList.add("wrong");

    feedback.textContent = `✗ Not quite. ${question.explanation}`;
    feedback.className = "feedback bad";
  }

  scoreSmall.textContent = `Score: ${score}`;

  nextQuestion.disabled = false;
  nextQuestion.textContent =
    questionIndex === QUESTIONS.length - 1
      ? "See My Results →"
      : "Next Question →";

  nextQuestion.focus();
}

function showResults() {
  const percentage = Math.round(
    (score / QUESTIONS.length) * 100
  );

  let icon = "🌟";
  let heading = "Good effort!";
  let message = "Keep exploring the Solar System and try again.";

  if (score === QUESTIONS.length) {
    icon = "🏆";
    heading = "Space Expert!";
    message = "Perfect score! You know your Solar System really well.";
  } else if (score >= 3) {
    icon = "🚀";
    heading = "Well done!";
    message = "Great work! You are becoming a Solar System explorer.";
  }

  quizContent.innerHTML = `
    <div class="result">
      <div class="result-icon">${icon}</div>
      <h3>${heading}</h3>
      <div class="final-score">${score}/${QUESTIONS.length}</div>
      <p>You answered ${score} out of ${QUESTIONS.length} questions correctly (${percentage}%).</p>
      <p>${message}</p>
      <button class="next-btn" id="retakeQuiz" type="button">
        ↻ Try Again
      </button>
    </div>
  `;

  document.getElementById("retakeQuiz").onclick = startQuiz;
}

nextQuestion.onclick = () => {
  if (!answered) return;

  if (questionIndex < QUESTIONS.length - 1) {
    questionIndex++;
    renderQuestion();
  } else {
    showResults();
  }
};

function closeQuizDialog() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  openQuiz.focus();
}

openQuiz.onclick = startQuiz;
closeQuiz.onclick = closeQuizDialog;

overlay.addEventListener("click", event => {
  if (event.target === overlay) {
    closeQuizDialog();
  }
});

document.addEventListener("keydown", event => {
  if (
    event.key === "Escape" &&
    overlay.classList.contains("open")
  ) {
    closeQuizDialog();
  }
});
</script>

</body>
</html>
